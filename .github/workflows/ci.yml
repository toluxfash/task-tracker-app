name: CI Pipeline (Temporary No-Lint)

on:
  push:
    branches: [ "main", "staging" ]
  pull_request:
    branches: [ "main", "staging" ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Setup Node
      uses: actions/setup-node@v3
      with: { node-version: '18' }
    - run: |
        cd backend
        npm install
        npm test

  # Frontend job with no linting
  check-frontend:
    runs-on: ubuntu-latest
    needs: test-backend
    steps:
    - uses: actions/checkout@v3
    - name: Verify frontend installs
      run: |
        cd frontend
        npm install
      # No tests or linting run