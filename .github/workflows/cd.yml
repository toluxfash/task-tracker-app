name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    branches: [main, staging]
    types: [completed]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    # 1. Build and push images to Docker Hub (unchanged)
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_TOKEN }}
        
    - name: Build and push backend
      run: |
        docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/mern-task-backend:latest ./backend
        docker push ${{ secrets.DOCKER_HUB_USERNAME }}/mern-task-backend:latest
        
    - name: Build and push frontend
      run: |
        docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/mern-task-frontend:latest ./frontend
        docker push ${{ secrets.DOCKER_HUB_USERNAME }}/mern-task-frontend:latest
        
    # 2. Environment setup
    - name: Determine environment
      id: set-env
      run: |
        if [ "$GITHUB_REF" == "refs/heads/main" ]; then
          echo "EC2_HOST=${{ secrets.AWS_EC2_PROD_HOST }}" >> $GITHUB_ENV
          echo "FRONTEND_PORT=80" >> $GITHUB_ENV
          echo "BACKEND_PORT=5000" >> $GITHUB_ENV
        else
          echo "EC2_HOST=${{ secrets.AWS_EC2_STAGING_HOST }}" >> $GITHUB_ENV
          echo "FRONTEND_PORT=8080" >> $GITHUB_ENV
          echo "BACKEND_PORT=5001" >> $GITHUB_ENV
        fi

    # 3. Docker Compose deployment
    - name: Deploy to ${{ contains(github.ref, 'main') && 'Production' || 'Staging' }}
      uses: appleboy/ssh-action@master
      with:
        host: ${{ env.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.AWS_EC2_SSH_KEY }}
        script: |
          # Create docker-compose.yml
          cat > docker-compose.yml << 'EOF'
          version: "3.8"
          services:
            backend:
              image: ${{ secrets.DOCKER_HUB_USERNAME }}/mern-task-backend:latest
              container_name: backend
              env_file: ./backend/.env
              ports:
                - "${{ env.BACKEND_PORT }}:5000"
              restart: unless-stopped
              healthcheck:
                test: ["CMD", "curl", "-f", "http://localhost:5000/tasks"]
                interval: 30s
                timeout: 10s
                retries: 3
                start_period: 5s

            frontend:
              image: ${{ secrets.DOCKER_HUB_USERNAME }}/mern-task-frontend:latest
              container_name: frontend
              env_file: ./frontend/.env
              ports:
                - "${{ env.FRONTEND_PORT }}:5173"
              restart: unless-stopped
              depends_on:
                backend:
                  condition: service_healthy
              healthcheck:
                test: ["CMD", "curl", "-f", "http://localhost:5173"]
                interval: 30s
                timeout: 10s
                retries: 10
                start_period: 30s
          EOF

          # Create env files from secrets
          mkdir -p backend frontend
          echo "${{ secrets.BACKEND_ENV }}" > backend/.env
          echo "${{ secrets.FRONTEND_ENV }}" > frontend/.env

          # Clean then deploy
          docker compose down || true
          docker compose up -d

          # Verify deployment
          sleep 10
          docker ps
          curl -I http://localhost:${{ env.FRONTEND_PORT }}