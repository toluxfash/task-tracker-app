name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    branches: [main, staging]
    types: [completed]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    # 1. Build and push images (unchanged)
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_TOKEN }}
        
    - name: Build and push backend
      run: |
        docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/mern-task-backend:latest ./backend
        docker push ${{ secrets.DOCKER_HUB_USERNAME }}/mern-task-backend:latest
        
    - name: Build and push frontend
      run: |
        docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/mern-task-frontend:latest ./frontend
        docker push ${{ secrets.DOCKER_HUB_USERNAME }}/mern-task-frontend:latest
        
    # 2. Environment setup
    - name: Determine environment
      id: set-env
      run: |
        if [ "$GITHUB_REF" == "refs/heads/main" ]; then
          echo "EC2_HOST=${{ secrets.AWS_EC2_PROD_HOST }}" >> $GITHUB_ENV
          echo "FRONTEND_PORT=80" >> $GITHUB_ENV
          echo "BACKEND_PORT=5000" >> $GITHUB_ENV
        else
          echo "EC2_HOST=${{ secrets.AWS_EC2_STAGING_HOST }}" >> $GITHUB_ENV
          echo "FRONTEND_PORT=8080" >> $GITHUB_ENV
          echo "BACKEND_PORT=5000" >> $GITHUB_ENV
        fi

    # 3. Enhanced Docker Compose deployment
    - name: Deploy to ${{ contains(github.ref, 'main') && 'Production' || 'Staging' }}
      uses: appleboy/ssh-action@master
      with:
        host: ${{ env.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.AWS_EC2_SSH_KEY }}
        script: |
          # Create optimized docker-compose.yml
          cat > docker-compose.yml << 'EOF'
          services:
            backend:
              image: ${{ secrets.DOCKER_HUB_USERNAME }}/mern-task-backend:latest
              container_name: backend
              env_file: ./backend/.env
              ports:
                - "${{ env.BACKEND_PORT }}:5000"
              restart: unless-stopped
              healthcheck:
                test: ["CMD-SHELL", "curl -f http://localhost:5000/tasks || exit 1"]
                interval: 45s
                timeout: 20s
                retries: 5
                start_period: 30s

            frontend:
              image: ${{ secrets.DOCKER_HUB_USERNAME }}/mern-task-frontend:latest
              container_name: frontend
              env_file: ./frontend/.env
              ports:
                - "${{ env.FRONTEND_PORT }}:5173"
              restart: unless-stopped
              depends_on:
                backend:
                  condition: service_healthy
          EOF

          # Create env files
          mkdir -p backend frontend
          echo "${{ secrets.BACKEND_ENV }}" > backend/.env
          echo "${{ secrets.FRONTEND_ENV }}" > frontend/.env

          # Deployment with retries
          docker compose down || true
          
          for attempt in {1..3}; do
            echo "Attempt $attempt/3"
            docker compose up -d
            
            # Wait for backend health
            timeout 120 bash -c 'until [ "$(docker inspect -f {{.State.Health.Status}} backend)" == "healthy" ]; do
              echo "Waiting for backend..."
              sleep 10
            done' || continue
            
            # Verify frontend
            if curl -sSf http://localhost:${{ env.FRONTEND_PORT }} >/dev/null; then
              echo "Deployment successful!"
              exit 0
            fi
            
            docker compose restart
          done
          
          echo "Deployment failed after 3 attempts"
          exit 1