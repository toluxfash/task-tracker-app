name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]  # Waits for CI workflow by name
    branches: [main, staging]
    types: [completed]  # Only trigger after CI finishes

jobs:
  deploy:
    # Only proceed if CI succeeded (not 'failed' or 'cancelled')
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_TOKEN }}
        
    - name: Build and push backend
      run: |
        docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/mern-task-backend:latest ./backend
        docker push ${{ secrets.DOCKER_HUB_USERNAME }}/mern-task-backend:latest
        
    - name: Build and push frontend
      run: |
        docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/mern-task-frontend:latest ./frontend
        docker push ${{ secrets.DOCKER_HUB_USERNAME }}/mern-task-frontend:latest
        
    - name: Determine environment
      id: set-env
      run: |
        if [ "$GITHUB_REF" == "refs/heads/main" ]; then
          echo "EC2_HOST=${{ secrets.AWS_EC2_PROD_HOST }}" >> $GITHUB_ENV
          echo "FRONTEND_PORT=80" >> $GITHUB_ENV
          echo "BACKEND_PORT=5000" >> $GITHUB_ENV
        else
          echo "EC2_HOST=${{ secrets.AWS_EC2_STAGING_HOST }}" >> $GITHUB_ENV
          echo "FRONTEND_PORT=8080" >> $GITHUB_ENV
          echo "BACKEND_PORT=5001" >> $GITHUB_ENV
        fi

    - name: Deploy to ${{ contains(github.ref, 'main') && 'Production' || 'Staging' }}
      uses: appleboy/ssh-action@master
      with:
        host: ${{ env.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.AWS_EC2_SSH_KEY }}
        script: |
          docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/mern-task-backend:latest
          docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/mern-task-frontend:latest
          docker stop backend || true
          docker stop frontend || true
          docker rm backend || true
          docker rm frontend || true
          docker run -d --name backend -p ${{ env.BACKEND_PORT }}:5000 ${{ secrets.DOCKER_HUB_USERNAME }}/mern-task-backend:latest
          docker run -d --name frontend -p ${{ env.FRONTEND_PORT }}:5173 ${{ secrets.DOCKER_HUB_USERNAME }}/mern-task-frontend:latest